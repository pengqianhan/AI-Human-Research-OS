name: Sync mattpocock-skills mirror

# Weekly, human-gated refresh of the read-only `mattpocock-skills` vendored
# mirror. Detects upstream drift and opens (or updates) a PR — it NEVER merges.
# The PR diff is the review gate required by ADR 0001.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-mattpocock-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh mirror from upstream
        run: bash Research-skills-hub/mattpocock-skills/scripts/refresh.sh

      - name: Open or update PR when upstream changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Mirror already matches upstream; nothing to do."
            exit 0
          fi

          BRANCH="sync/mattpocock-skills"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add -A
          git commit -m "chore: sync mattpocock-skills mirror from upstream"
          git push -f -u origin "$BRANCH"

          if gh pr view "$BRANCH" >/dev/null 2>&1; then
            echo "PR for $BRANCH already open; force-pushed the latest diff."
          else
            BODY=$(printf '%s\n' \
              'Automated wholesale refresh of the read-only `mattpocock-skills` vendored mirror' \
              'from https://github.com/mattpocock/skills (paths `skills/engineering`, `skills/productivity`).' \
              '' \
              'Review the diff before merging — this is the human gate per ADR 0001.' \
              'Do not edit mirrored skills in place; adapt by cherry-picking into `collected-skills/`.')
            gh pr create --base "${GITHUB_REF_NAME}" --head "$BRANCH" \
              --title "Sync mattpocock-skills mirror from upstream" \
              --body "$BODY"
          fi
