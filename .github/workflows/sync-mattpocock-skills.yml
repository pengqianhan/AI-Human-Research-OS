name: Sync mattpocock-skills mirror

# Weekly, fully automatic refresh of the read-only `mattpocock-skills` vendored
# mirror. Detects upstream drift, opens a PR, and squash-merges it immediately.
# The PR exists only as an audit trail of what landed — there is no review gate
# (ADR 0001, superseded 2026-07-24: upstream is a maintained repo we track).

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-mattpocock-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh mirror from upstream
        run: bash research-skills-hub/mattpocock-skills/scripts/refresh.sh

      - name: Open and auto-merge a PR when upstream changed
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Mirror already matches upstream; nothing to do."
            exit 0
          fi

          BRANCH="sync/mattpocock-skills"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add -A
          git commit -m "chore: sync mattpocock-skills mirror from upstream"
          git push -f -u origin "$BRANCH"

          # Reuse a still-open PR (a previous run's merge may have failed);
          # `gh pr view` also matches merged PRs, so filter on state explicitly.
          PR="$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')"
          if [[ -n "$PR" ]]; then
            echo "PR #$PR is still open; force-pushed the latest diff onto it."
          else
            BODY=$(printf '%s\n' \
              'Automated wholesale refresh of the read-only `mattpocock-skills` vendored mirror' \
              'from https://github.com/mattpocock/skills (paths `skills/engineering`, `skills/productivity`).' \
              '' \
              'Merged automatically — this PR is an audit trail, not a review gate.' \
              'Do not edit mirrored skills in place; adapt by cherry-picking into `collected-skills/`.')
            PR="$(gh pr create --base "$BASE" --head "$BRANCH" \
              --title "Sync mattpocock-skills mirror from upstream" \
              --body "$BODY" | tail -1 | grep -oE '[0-9]+$')"
          fi

          gh pr merge "$PR" --squash --delete-branch
          echo "Merged PR #$PR into $BASE."
