name: Deploy paper-wiki to Pages

# Publishes paper-wiki/ so the OKF viewer is readable from any browser:
# https://pengqianhan.github.io/AI-Human-Research-OS/paper-wiki/viz.html
# Deploys from the autoreadpaper branch only.

on:
  push:
    branches: [autoreadpaper]
    paths:
      - 'paper-wiki/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage site
        run: |
          mkdir -p _site/paper-wiki
          cp -r paper-wiki/. _site/paper-wiki/
          printf '%s' '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=paper-wiki/viz.html"><a href="paper-wiki/viz.html">paper wiki</a>' > _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
