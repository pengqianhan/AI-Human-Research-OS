name: Deploy os-ui to Pages

# Publishes a view-only build of os-ui, with the paper wiki inside it:
#   https://pengqianhan.github.io/AI-Human-Research-OS/                     os-ui desktop
#   https://pengqianhan.github.io/AI-Human-Research-OS/paper-wiki/viz.html  paper wiki
# Deploys from the autoreadpaper branch only, so the nightly paper run is
# public at once; the rest of the OS updates when main is merged into it.
#
# A production build has no write or agent endpoints (their Vite plugins are
# serve-only) and hides those controls (os-ui/frontend/src/lib/mode.ts). It is
# built from the checkout, so only tracked files reach the site. No path
# filter: state.json reads files all over the repository.

on:
  push:
    branches: [autoreadpaper]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 30 # the Dashboard's activity timeline reads `git log -15`

      - uses: astral-sh/setup-uv@v10.2.0 # publishes no moving major tag

      - name: Install the pinned Python
        run: uv python install "$(cat .python-version)"

      # The same two steps os-ui/start.sh runs before the dev server.
      - name: Generate state.json and stage the paper wiki
        run: |
          uv run --no-project --python "$(cat .python-version)" -- python os-ui/generator/generate.py
          mkdir -p os-ui/frontend/public/paper-wiki
          cp -r paper-wiki/. os-ui/frontend/public/paper-wiki/

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: os-ui/frontend/package-lock.json

      # Relative base: the site lives under /AI-Human-Research-OS/.
      - name: Build os-ui
        working-directory: os-ui/frontend
        run: |
          npm ci
          npx vite build --base=./

      # Live site only: the os-ui source stays as it is, and this adds a GitHub
      # link (Octicons mark-github, MIT) to the published index.html, fixed at
      # the top-right of the menu bar. Right padding on the menu bar (os-ui's
      # only top-level <header>) moves its chips clear of the button; if that
      # structure changes, the button overlaps them rather than breaking.
      - name: Add the GitHub link to the published page
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          python3 - <<'PY'
          import html, os, pathlib
          page = pathlib.Path("os-ui/frontend/dist/index.html")
          url = html.escape(os.environ["REPO_URL"], quote=True)
          mark = "M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"
          link = (
              "<style>.osui-gh-link{position:fixed;top:7px;right:16px;z-index:2147483000;"
              "display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 12px;"
              "border:1px solid #17262E;border-radius:999px;background:#17262E;color:#FFFFFF;"
              "font:600 11.5px/1 var(--mono,ui-monospace,monospace);text-decoration:none;"
              "white-space:nowrap;transition:background .15s,border-color .15s}"
              ".osui-gh-link:hover,.osui-gh-link:focus-visible{background:#52646E;border-color:#52646E}"
              ".osui-gh-link:focus-visible{outline:2px solid #E8590C;outline-offset:2px}"
              "#root>div>header{padding-right:100px}"
              "@media (max-width:639px){.osui-gh-label{display:none}"
              ".osui-gh-link{padding:0 5px}#root>div>header{padding-right:40px}}</style>"
              f'<a class="osui-gh-link" href="{url}" target="_blank" rel="noopener noreferrer" '
              'aria-label="Source on GitHub" title="Source on GitHub">'
              f'<svg viewBox="0 0 16 16" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="{mark}"/></svg>'
              '<span class="osui-gh-label">GitHub</span></a>'
          )
          text = page.read_text(encoding="utf-8")
          assert text.count("</body>") == 1, "expected exactly one </body> in the built index.html"
          page.write_text(text.replace("</body>", link + "</body>"), encoding="utf-8")
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: os-ui/frontend/dist

      - id: deployment
        uses: actions/deploy-pages@v4
