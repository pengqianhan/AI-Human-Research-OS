name: Deploy os-ui to Pages

# Publishes a view-only build of os-ui, with the paper wiki inside it:
#   https://pengqianhan.github.io/AI-Human-Research-OS/                     os-ui desktop
#   https://pengqianhan.github.io/AI-Human-Research-OS/paper-wiki/viz.html  paper wiki
# Deploys from the autoreadpaper branch only, so the nightly paper run is
# public at once; the rest of the OS updates when main is merged into it.
#
# A production build has no write or agent endpoints (their Vite plugins are
# serve-only) and hides those controls (os-ui/frontend/src/lib/mode.ts). It is
# built from the checkout, so only tracked files reach the site. No path
# filter: state.json reads files all over the repository.

on:
  push:
    branches: [autoreadpaper]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 30 # the Dashboard's activity timeline reads `git log -15`

      - uses: astral-sh/setup-uv@v10.2.0 # publishes no moving major tag

      - name: Install the pinned Python
        run: uv python install "$(cat .python-version)"

      # The same two steps os-ui/start.sh runs before the dev server.
      - name: Generate state.json and stage the paper wiki
        run: |
          uv run --no-project --python "$(cat .python-version)" -- python os-ui/generator/generate.py
          mkdir -p os-ui/frontend/public/paper-wiki
          cp -r paper-wiki/. os-ui/frontend/public/paper-wiki/

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: os-ui/frontend/package-lock.json

      # Relative base: the site lives under /AI-Human-Research-OS/.
      - name: Build os-ui
        working-directory: os-ui/frontend
        env:
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }} # menu-bar GitHub link
        run: |
          npm ci
          npx vite build --base=./

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: os-ui/frontend/dist

      - id: deployment
        uses: actions/deploy-pages@v4
