name: CI

# The product's gate for main (SuperResearch OS). It runs on every PR with no
# path filter, because a required check that is skipped never reports and would
# block the PR forever.
#
# Fork PRs run on `pull_request` (never `pull_request_target`), so contributed
# code gets the read-only token below and no secrets.
#
# verify.sh and the generator step read a workspace at the repository root,
# which this repository does not hold (verify.sh says which checks).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0 # publishes no moving major tag

      # verify.sh runs offline with --no-python-downloads, so the pinned
      # interpreter must already be installed.
      - name: Install the pinned Python
        run: uv python install "$(cat .python-version)"

      - name: Repository consistency (verify.sh)
        run: ./verify.sh

      # The canonical copies of the five shipped skills and the harness. The
      # workspace repository runs the tests of the skills that stay with it.
      - name: Unit tests
        run: |
          py() { uv run --no-project --python "$(cat .python-version)" -- python "$@"; }
          hub=research-skills-hub/open-paper-skills
          py -m unittest discover -s "$hub/paper-wiki-manager/scripts" -p 'test_*.py'
          py -m unittest discover -s "$hub/research-project-manager/scripts" -p 'test_*.py'
          py -m unittest discover -s "$hub/paper-search/scripts" -p 'test_*.py'
          py -m unittest discover -s "$hub/research-skill-installer/scripts" -p 'test_*.py'
          # test_live skips itself unless OS_HARNESS_LIVE=1; CI never sets it.
          py -m unittest discover -s os-harness/tests

      - name: os-ui state.json generates
        run: uv run --no-project --python "$(cat .python-version)" -- python os-ui/generator/generate.py

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: os-ui/frontend/package-lock.json

      - name: os-ui type-check and build
        working-directory: os-ui/frontend
        run: |
          npm ci
          npm run build

      # The endpoints the dev server and the desktop client share
      # (os-ui/frontend/server), including one detached os-harness turn with
      # its fake Claude CLI and a real Vite dev server. The desktop client's
      # own jobs live in desktop.yml, which is advisory.
      - name: os-ui endpoint tests
        working-directory: os-ui/frontend
        run: npm test
