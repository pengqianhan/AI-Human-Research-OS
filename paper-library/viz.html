6741"}}, {"data": {"id": "topics/agent-self-evolution__papers/2605.22721", "source": "topics/agent-self-evolution", "target": "papers/2605.22721"}}, {"data": {"id": "topics/ai-for-science__papers/2605.28655", "source": "topics/ai-for-science", "target": "papers/2605.28655"}}, {"data": {"id": "topics/ai-for-science__papers/2606.11926", "source": "topics/ai-for-science", "target": "papers/2606.11926"}}, {"data": {"id": "topics/ai-for-science__papers/2606.13662", "source": "topics/ai-for-science", "target": "papers/2606.13662"}}, {"data": {"id": "topics/autonomous-research__papers/2606.11926", "source": "topics/autonomous-research", "target": "papers/2606.11926"}}, {"data": {"id": "topics/gpu-kernel-optimization__papers/2605.31464", "source": "topics/gpu-kernel-optimization", "target": "papers/2605.31464"}}, {"data": {"id": "topics/llm-agents__papers/2606.06741", "source": "topics/llm-agents", "target": "papers/2606.06741"}}, {"data": {"id": "topics/llm-agents__papers/2606.10662", "source": "topics/llm-agents", "target": "papers/2606.10662"}}, {"data": {"id": "topics/llm-agents__papers/2606.11926", "source": "topics/llm-agents", "target": "papers/2606.11926"}}, {"data": {"id": "topics/llm-agents__papers/2606.13662", "source": "topics/llm-agents", "target": "papers/2606.13662"}}, {"data": {"id": "topics/llm-surrogate-models__papers/2605.31464", "source": "topics/llm-surrogate-models", "target": "papers/2605.31464"}}, {"data": {"id": "topics/multi-agent-systems__papers/2606.10662", "source": "topics/multi-agent-systems", "target": "papers/2606.10662"}}, {"data": {"id": "topics/multi-agent-systems__papers/2605.28655", "source": "topics/multi-agent-systems", "target": "papers/2605.28655"}}, {"data": {"id": "topics/multi-agent-systems__papers/2605.22721", "source": "topics/multi-agent-systems", "target": "papers/2605.22721"}}], "bodies": {"papers/2605.22721": "# Summary\n\nThis paper introduces DecentMem, a decentralized memory framework for self-evolving multi-agent systems. Rather than sharing a single central memory repository across all agents, each agent maintains its own dual-pool memory: an **exploitation pool** of consolidated past trajectories, and an **exploration pool** of LLM-generated candidate responses for unseen contexts. An LLM-as-a-judge reweights the two pools online using stage-wise feedback.\n\nThe motivation is that centralized memory creates communication and coordination overhead, raises privacy concerns, and collapses agent diversity over time.\n\n# Key Ideas\n\n* Each agent keeps independent memory, eliminating cross-agent coordination overhead and preserving behavioral diversity.\n* Dual-pool design separates exploitation (reliable past solutions) from exploration (LLM-generated candidates for new contexts), allowing dynamic adaptation.\n* LLM-as-a-judge provides online reweighting of the two pools based on stage-wise performance feedback.\n* Theoretical analysis proves global reachability of the solution space and O(log T) cumulative regret, matching the stochastic bandit lower bound up to constants.\n\n# Method\n\nDecentMem assigns a dual-pool memory to every agent independently. During inference the agent queries both pools, and the LLM-as-a-judge scores each candidate to determine the pool mixing weight. Memory consolidation happens locally, avoiding synchronization across agents.\n\n# Experiments\n\n* Tested on three MAS frameworks: AutoGen, DyLAN, AgentNet.\n* Backbone models: Qwen3 (4B / 8B / 14B) and Gemma4 (E2B / E4B).\n* Five benchmarks spanning math, code, QA, and embodied tasks.\n* Improves average accuracy by up to 23.8% over the strongest centralized memory baseline.\n* Improves by up to 52.5% over a no-memory baseline.\n* Reduces token usage by up to 49% relative to centralized memory.\n\n# Limitations\n\n* Results depend on the quality of LLM-as-a-judge signals; a weak judge may misweight the two pools.\n* The exploration pool relies on LLM generation for unseen contexts, which may introduce hallucinated candidates.\n* Evaluation uses Qwen3 and Gemma4 families; generalization to other model families is not directly tested.\n\n# Notes\n\nReading questions:\n\n* How does the judge decide what counts as \"stage-wise feedback\" — is it task-level reward, step-level critique, or something else?\n* How do the exploitation and exploration pools interact when a context is only partially covered by past trajectories?\n* Does per-agent memory lead to inconsistent agent behaviors in tasks that require tight coordination?\n* How does DecentMem compare to 2606.10662 (DeLM), which uses decentralized agents with shared verified context instead of per-agent memory?\n\n# Related\n\n* [Multi-agent systems](../topics/multi-agent-systems.md)\n* [Agent self-evolution](../topics/agent-self-evolution.md)\n* [Decentralized Multi-Agent Systems with Shared Context](2606.10662.md) — complementary decentralized design that uses shared context instead of per-agent memory.\n* [AutoScientists](2605.28655.md) — another self-organizing MAS paper in the library.\n\n# Citations\n\n[1] [arXiv:2605.22721](https://arxiv.org/abs/2605.22721)", "papers/2605.28655": "# Summary\n\nThis paper introduces AutoScientists, a decentralized team of AI agents for long-running computational scientific experimentation. The system is designed to sustain multiple research directions, adapt to new experimental evidence, and preserve knowledge about failed attempts.\n\nThe paper frames scientific research as an iterative loop of hypothesis generation, experiment design, execution, and revision. Its central claim is that self-organizing teams can explore this loop more effectively than a single trajectory or a centrally planned agent.\n\n# Key Ideas\n\n* Agents interpret a shared experimental state and organize into teams around promising hypotheses.\n* Proposals are critiqued before consuming experimental compute.\n* Successes and failures are shared to reduce redundant exploration.\n* The system targets long-running experiments where evidence changes over time.\n\n# Experiments\n\n* BioML-Bench: reports a mean leaderboard percentile of 74.4 across 24 tasks, improving over the strongest AI agent by 8.33 percentage points.\n* GPT training optimization: reports reaching target validation bits-per-byte 1.9x faster than Autoresearch.\n* ProteinGym ACE2-Spike binding: reports a 12.5 percent improvement in Spearman correlation over the prior state of the art.\n* ProteinGym full sweep: reports a 6.5 percent Spearman correlation improvement across 217 assays.\n\n# Notes\n\nReading questions:\n\n* What coordination mechanism lets teams form and dissolve without central planning?\n* How is failed experimental knowledge represented so later agents can reuse it?\n* Which ideas transfer from scientific experimentation to OKF paper-library curation and long-running literature review?\n\n# Related\n\n* [AI for science](../topics/ai-for-science.md)\n* [Multi-agent systems](../topics/multi-agent-systems.md)\n* [Decentralized Multi-Agent Systems with Shared Context](2606.10662.md) is relevant for shared-context coordination.\n* [OpenSkill](2606.06741.md) is relevant for agents building transferable skills from open-world resources.\n\n# Citations\n\n[1] [arXiv:2605.28655](https://arxiv.org/abs/2605.28655)", "papers/2605.31464": "# Summary\n\nThis paper studies whether LLMs can act as selective surrogates for GPU kernel evaluation, forecasting the runtime/performance of a candidate kernel instead of compiling and executing it on hardware. The motivation is that as LLM-driven kernel search scales to large search budgets, repeated on-device measurement becomes the bottleneck, not kernel generation.\n\n# Key Ideas\n\n* Use an LLM to forecast relative performance of a candidate GPU kernel directly from source code, avoiding a compile-and-execute cycle on real hardware.\n* Make the surrogate selective: it should know when its forecast is unreliable and defer to a real GPU measurement rather than guess.\n* Evaluate surrogates along three axes: forecast accuracy, calibration of confidence, and practical usefulness for recovering fast kernels under a fixed GPU-measurement budget.\n* Use reinforcement learning to improve both forecast accuracy and confidence calibration beyond a base pretrained LLM.\n\n# Method\n\nThe surrogate is an LLM that reads kernel source code and predicts relative runtime/performance, paired with a confidence signal used to decide whether to trust the forecast or fall back to an actual GPU measurement. The surrogate is plugged into a kernel search loop (e.g., evolutionary search or coding-agent search) in place of, or alongside, on-device evaluation.\n\n# Experiments\n\n* Compares forecast accuracy and calibration of the LLM surrogate against ground-truth GPU measurements.\n* Integrates the surrogate into a kernel search process and reports that it lets the search examine several times as many candidates under the same GPU-evaluation budget.\n* Reports that surrogate-assisted search finds faster kernels than an equal-budget baseline that relies solely on real GPU measurement.\n\n# Limitations\n\n* The paper notes (per the authors' framing) open questions about whether LLM forecasts generalize across unfamiliar hardware configurations and kernel families not seen during calibration.\n\n# Notes\n\nRead at a summary level (abstract + PDF skim); not yet read in full. Reading questions:\n\n* What confidence/selectivity mechanism is used to decide \"trust forecast vs. measure on GPU,\" and how is it calibrated?\n* How much of the speedup comes from the surrogate itself vs. simply running more search iterations cheaply?\n* Could the same selective-surrogate idea apply to other expensive-to-evaluate search domains (e.g., compiler flags, model architecture search)?\n\n# Related\n\n* [GPU kernel optimization](../topics/gpu-kernel-optimization.md)\n* [LLM surrogate models](../topics/llm-surrogate-models.md)\n\n# Citations\n\n[1] [arXiv:2605.31464](https://arxiv.org/abs/2605.31464)", "papers/2606.06741": "# Summary\n\nThis paper introduces OpenSkill, a framework for open-world self-evolution of LLM agents. The core setting assumes the deployed agent receives only a task prompt and cannot rely on curated skills, successful trajectories, verifier signals, or target-task supervision.\n\nOpenSkill bootstraps a learning loop by acquiring grounded knowledge and verification anchors from documentation, repositories, and the web. It synthesizes those anchors into transferable skills, then refines the skills against self-built virtual tasks.\n\n# Key Ideas\n\n* Treat open-world resources as the source of both knowledge and practice environments.\n* Build skills and verification signals from scratch rather than assuming they already exist.\n* Reserve target-task supervision for final evaluation rather than training.\n* Test whether learned skills transfer across target agents and models.\n\n# Experiments\n\n* Reports best automated pass rate across three benchmarks and two target agents while satisfying the no-supervision constraint.\n* Reports that learned skills transfer across models without model-specific adaptation.\n* Reports that the self-built verifier aligns with ground-truth outcomes despite not accessing them during skill construction.\n\n# Notes\n\nReading questions:\n\n* What counts as a verification anchor, and how does the framework judge anchor quality?\n* How are generated skills represented and versioned?\n* Which parts of OpenSkill are directly applicable to an OKF `paper-library-manager` workflow?\n\n# Related\n\n* [LLM agents](../topics/llm-agents.md)\n* [Agent self-evolution](../topics/agent-self-evolution.md)\n* [Decentralized Multi-Agent Systems with Shared Context](2606.10662.md) is relevant for shared context and multi-agent execution.\n* [AutoScientists](2605.28655.md) is relevant for self-organized, long-running agent work.\n\n# Citations\n\n[1] [arXiv:2606.06741](https://arxiv.org/abs/2606.06741)", "papers/2606.10662": "# Summary\n\nThis paper introduces Decentralized Language Models (DeLM), a multi-agent system design where parallel agents coordinate through shared verified context and a task queue instead of a single central controller. Agents claim subtasks asynchronously, read accumulated progress, reason locally, and write compact verified updates back to the shared context.\n\nThe motivation is that centralized multi-agent orchestration can become a communication and integration bottleneck as the number of subtasks grows.\n\n# Key Ideas\n\n* Replace centralized task assignment and result merging with decentralized workers using a shared context substrate.\n* Keep shared context compact and verified so agents can build on prior progress without forwarding every update through a controller.\n* Use the design for test-time scaling in software engineering and long-context reasoning.\n\n# Experiments\n\n* SWE-bench Verified: reports best performance across Avg.@1, Pass@2, and Pass@4, with gains up to 10.5 percentage points over the strongest baseline.\n* Cost: reports roughly 50 percent lower cost per task.\n* LongBench-v2 Multi-Doc QA: reports highest average accuracy across four frontier model families, with gains up to 5.7 percentage points over the strongest baseline.\n\n# Notes\n\nReading questions:\n\n* What exactly qualifies an update as \"verified\" before it enters shared context?\n* How does DeLM prevent stale or contradictory context from degrading downstream agents?\n* Can this design inform OKF paper-library maintenance workflows, where many small updates need to merge into durable shared notes?\n\n# Related\n\n* [Multi-agent systems](../topics/multi-agent-systems.md)\n* [LLM agents](../topics/llm-agents.md)\n* [OpenSkill](2606.06741.md) also treats reusable skills and verification signals as durable artifacts for agents.\n* [AutoScientists](2605.28655.md) also uses decentralized agent teams, but for scientific experimentation rather than software-engineering test-time scaling.\n\n# Citations\n\n[1] [arXiv:2606.10662](https://arxiv.org/abs/2606.10662)", "papers/2606.11926": "# Summary\n\nThis paper introduces Arbor, a general framework for long-horizon autonomous research in a setting the authors call Autonomous Optimization. In this setting, an agent starts from an initial artifact, iteratively changes it using development-evaluator feedback, and should only count progress when improvements transfer to a held-out evaluator.\n\nArbor's core mechanism is Hypothesis Tree Refinement. A persistent coordinator maintains a tree of hypotheses, evidence, artifact references, and distilled insights, while short-lived executors test individual hypotheses in isolated git worktrees. The tree is meant to turn research from a flat sequence of local trials into cumulative branching, falsification, insight propagation, and verified artifact improvement.\n\n# Key Ideas\n\n* Autonomous Optimization frames autonomous research as iterative improvement of a mutable artifact under a fixed objective, development evaluator, and held-out test evaluator.\n* Hypothesis Tree Refinement makes the research state explicit: each node records a hypothesis, score/result evidence, reusable insight, and a code reference.\n* The coordinator owns global strategy and the tree; executors own local implementation and evaluation for one assigned hypothesis.\n* Upward insight propagation turns local results, including failures, into constraints and priors for later ideation.\n* A held-out merge gate separates development-set exploration from verified artifact-level progress.\n* The design makes autonomous research inspectable: every accepted or rejected change is attached to a hypothesis and evidence record rather than hidden in a long chat transcript.\n\n# Method\n\nArbor runs a repeated observe-ideate-select-dispatch-backpropagate-decide loop. The coordinator observes the current tree, proposes child hypotheses under promising or unresolved parents, selects pending leaves for execution, dispatches executors, writes returned evidence into the relevant nodes, propagates distilled insights to ancestors, then decides whether to merge, prune, continue, or stop.\n\nExecutors are deliberately hypothesis-bound. Each executor receives one hypothesis, relevant ancestor insights, the current best artifact, and the development evaluator. It creates a fresh worktree, implements the minimal intervention needed to test the hypothesis, runs the development evaluator, repairs implementation failures when needed, and returns a dev score, factual result, distilled insight, and branch reference.\n\nThe held-out evaluator is only used through the merge gate. A candidate branch is evaluated in a separate worktree and promoted only if it improves the current best under the held-out objective, which is the paper's main guard against overfitting the development feedback.\n\n# Experiments\n\nThe paper evaluates Arbor on six real Autonomous Optimization tasks spanning model training, harness engineering, and data synthesis:\n\n* Optimizer Design on NanoGPT-Bench.\n* Architecture Design on an autoresearch LLM training benchmark.\n* Terminal-Bench 2.0 harness engineering.\n* BrowseComp search-harness engineering.\n* Search-Agent Data Synthesis.\n* Math-Reasoning Data Synthesis.\n\nAcross those six tasks, Arbor reports the best held-out result on all six under the same task interface and resource budget used for Codex and Claude Code baselines. The paper reports more than 2.5x the average relative held-out gain of the two single-agent baselines. On MLE-Bench Lite, Arbor reports 86.36 percent Any Medal with GPT-5.5, with the same controller transferred through a task adapter.\n\nThe ablations argue that the gains are not only from executability: removing the tree or disabling insight feedback keeps valid submissions high but reduces medal outcomes on MLE-Bench Lite. The paper also reports that Arbor's BrowseComp-optimized harness transfers to unseen search-agent tasks, suggesting at least some learned harness changes generalize beyond the source benchmark.\n\n# Limitations\n\nThe evaluation is still a controlled proxy for research. The AO suite covers AI-oriented tasks with executable metrics, not open-ended domains where hypotheses are harder to specify, validate, or compare.\n\nThe current formulation mostly optimizes fixed scalar objectives. Real research usually involves multiple objectives, including robustness, cost, novelty, interpretability, reproducibility, and safety.\n\nThe method depends strongly on model quality and infrastructure. The paper notes that agents can still fail to generate genuinely new mechanisms, abandon promising directions too early, or chase score patterns instead of first-principles explanations. Long-horizon runs also incur substantial systems costs from model calls, evaluator scheduling, worktree management, and artifact handoffs.\n\n# Notes\n\nReading questions:\n\n* How should this Research OS represent hypothesis trees if autonomous experiments become a first-class project workflow?\n* Can the existing `task_plan.md`, `CHANGE_SUMMARY.md`, OKF notes, and generated visualizations act as a lightweight version of Arbor's persistent research state?\n* Where should held-out evaluation gates live for non-code research tasks such as literature synthesis or paper drafting?\n* How should negative results be promoted into reusable constraints without overfitting future ideation to a narrow benchmark?\n\n# Related\n\n* [Autonomous research](../topics/autonomous-research.md)\n* [AI for science](../topics/ai-for-science.md)\n* [LLM agents](../topics/llm-agents.md)\n* [EurekAgent](2606.13662.md) also targets autonomous scientific discovery, but emphasizes environment engineering around CLI agents rather than a persistent hypothesis tree.\n* [AutoScientists](2605.28655.md) also studies autonomous scientific experimentation, but focuses on self-organizing teams rather than coordinator-executor hypothesis-tree refinement.\n* [Decentralized Multi-Agent Systems with Shared Context](2606.10662.md) is relevant for shared verified context, while Arbor uses a centralized persistent tree as the run's research state.\n\n# Citations\n\n[1] [arXiv:2606.11926](https://arxiv.org/abs/2606.11926)\n[2] [RUC-NLPIR/Arbor](https://github.com/RUC-NLPIR/Arbor)", "papers/2606.13662": "# Summary\n\nThis paper introduces EurekAgent, an environment-engineered system for metric-driven autonomous scientific discovery. Instead of prescribing a specialized research workflow, the system coordinates off-the-shelf CLI agents through a prepare-propose-implement loop while shaping the surrounding environment: permissions, artifacts, budgets, and human oversight.\n\nThe central claim is that, as general-purpose coding agents become stronger, the bottleneck shifts from designing agent behavior to designing the environments that make autonomous research reliable, inspectable, resource-bounded, and hard to game.\n\n# Key Ideas\n\n* Treat environment engineering as the main control surface for autonomous scientific discovery.\n* Use permissions engineering to expose useful tools while protecting hidden evaluators, official result files, GPU allocation, and same-round peer isolation.\n* Use artifact engineering to make filesystem state, Git history, ranked solutions, logs, and evaluator feedback into shared long-term memory.\n* Use budget engineering for wall-clock and API-cost limits, stage deadlines, resumability, and controlled continuation.\n* Keep humans in the loop through a terminal UI and web monitor without requiring manual steering at every step.\n\n# Method\n\nEurekAgent receives a problem description, hidden evaluation code, a submission specification, optional initial code, and budget settings. It runs one prepare stage, then repeats proposal and parallel implementation stages for a configured number of rounds.\n\nThe proposal stage reads prior artifacts and generates diverse hypotheses. Each implementation session gets its own workspace, iterates against a secure evaluator, and cannot inspect same-round peers. The controller ranks valid submissions and carries prior-round artifacts forward as shared context.\n\n# Experiments\n\nThe paper evaluates EurekAgent with Claude Code as the CLI agent and GLM-5.1 as the base model across mathematics, kernel engineering, and machine learning engineering.\n\n* Mathematics: reports new state-of-the-art results on 26-circle packing, Erdos minimum overlap, and the first autocorrelation inequality while remaining training-free.\n* Kernel engineering: reports a best TriMul median runtime of 2005.03 microseconds under a local A100 evaluation, outperforming regraded leaderboard solutions and TTT-Discover in the reported setup.\n* Machine learning engineering: reports an 85.71 percent any-medal rate on a seven-task MLE-Bench Lite subset, above listed baseline rates on that subset.\n* Cost: reports all three mathematics runs below $17 average API cost, with the 26-circle packing result below $11 total API cost.\n\n# Limitations\n\nThe evidence is strongest for metric-driven tasks with executable evaluators. Broader scientific settings with less formal objectives may need different evaluation, provenance, and human-review mechanisms.\n\nThe MLE-Bench result is on a selected seven-task subset rather than the full benchmark, and the TriMul leaderboard comparison is based on local regrading because the official competition was closed.\n\n# Notes\n\nReading questions:\n\n* Which environment controls are general enough to transfer into this research OS, especially hidden evaluators, durable artifacts, and budget-aware continuation?\n* How should the system distinguish legitimate web/literature reuse from copying a public solution too directly?\n* Can OKF paper-library maintenance use the same environment-engineering frame: artifacts as memory, validation as evaluator, and topic pages as supervised shared context?\n\n# Related\n\n* [Agent environments](../topics/agent-environments.md)\n* [AI for science](../topics/ai-for-science.md)\n* [LLM agents](../topics/llm-agents.md)\n* [AutoScientists](2605.28655.md) also targets autonomous scientific experimentation, but emphasizes self-organizing teams rather than environment-level control surfaces.\n* [Decentralized Multi-Agent Systems with Shared Context](2606.10662.md) is relevant for shared-context coordination and verified durable updates.\n\n# Citations\n\n[1] [arXiv:2606.13662](https://arxiv.org/abs/2606.13662)\n[2] [THU-Team-Eureka/EurekAgent](https://github.com/THU-Team-Eureka/EurekAgent)", "topics/agent-environments": "# Scope\n\nThis topic tracks papers where the main design object is not only the agent policy or workflow, but the surrounding environment that grants affordances, constrains failure modes, records artifacts, manages resources, and enables supervision.\n\n# Papers\n\n* [EurekAgent](../papers/2606.13662.md) - environment engineering for metric-driven autonomous scientific discovery with CLI agents.\n\n# Open Questions\n\n* Which environment controls prevent reward hacking without blocking useful exploration?\n* What artifact formats make long-running agent work inspectable and resumable?\n* How much human supervision should be built into the environment rather than handled through ad hoc prompts?", "topics/agent-self-evolution": "# Scope\n\nThis topic tracks papers about agents that adapt after deployment by building skills, generating practice tasks, creating verification signals, or revising behavior from open-world resources.\n\n# Papers\n\n* [OpenSkill](../papers/2606.06741.md) - builds transferable skills and self-built verification anchors from documentation, repositories, and the web without target-task supervision.\n* [Self-Evolving Multi-Agent Systems via Decentralized Memory](../papers/2605.22721.md) - per-agent dual-pool memory (exploit past trajectories + explore LLM-generated candidates) with LLM-as-a-judge reweighting for continual improvement.\n\n# Synthesis\n\nOpenSkill and DecentMem both target continual agent improvement but differ in mechanism: OpenSkill builds reusable skill objects from external resources, while DecentMem accumulates and reweights trajectory-level memory within a multi-agent system. The two approaches are complementary and could potentially be combined.\n\n# Open Questions\n\n* How should generated skills be represented so they remain reusable and auditable?\n* What makes a self-built verifier reliable enough to guide agent improvement?\n* How can self-evolution workflows avoid overfitting to synthetic practice tasks?\n* Does per-agent memory evolution in DecentMem lead to agents that specialize or diverge in ways that reduce team coherence?\n", "topics/ai-for-science": "# Scope\n\nThis topic tracks papers about AI systems used to plan, run, and revise scientific experiments over repeated cycles.\n\n# Papers\n\n* [AutoScientists](../papers/2605.28655.md) - self-organizing agent teams for long-running computational scientific experimentation.\n* [Arbor](../papers/2606.11926.md) - hypothesis-tree refinement for autonomous optimization of research artifacts.\n* [EurekAgent](../papers/2606.13662.md) - environment engineering for metric-driven autonomous scientific discovery.\n\n# Synthesis\n\nAutoScientists emphasizes decentralized team organization for sustained experimentation, Arbor emphasizes persistent hypothesis management and held-out admission, while EurekAgent emphasizes the surrounding execution environment: hidden evaluators, durable artifacts, budget controls, and supervision interfaces. All three treat scientific discovery as iterative agent work, but they put the main design pressure on different layers.\n\n# Open Questions\n\n* How should failed experiments be captured so future agents avoid repeating them?\n* Which parts of scientific experimentation map onto long-running literature review workflows?\n* How should compute budgets shape agent critique and proposal acceptance?\n* Which environment boundaries are necessary before autonomous discovery results should be trusted?\n* How should hypothesis trees connect to project memory, paper skeletons, and durable experiment logs?", "topics/autonomous-research": "# Scope\n\nThis topic tracks systems that turn research objectives into iterative, agent-run loops of hypothesis generation, experiment execution, evidence interpretation, and artifact improvement.\n\n# Papers\n\n* [Arbor](../papers/2606.11926.md) - persistent hypothesis-tree refinement for long-horizon autonomous optimization of research artifacts.\n\n# Open Questions\n\n* What state representation best captures hypotheses, failed attempts, evidence, and accepted artifacts over long runs?\n* How should autonomous systems separate exploratory feedback from verified research claims?\n* Which research domains can be evaluated with executable metrics, and which need richer human or formal review?\n* What is the right human oversight point: ideation, execution, merge/admission, or final reporting?", "topics/gpu-kernel-optimization": "# Scope\n\nThis topic tracks papers about generating, searching over, and evaluating GPU kernels for performance, especially work that targets the cost of repeated on-device measurement during search.\n\n# Papers\n\n* [GPU Forecasters](../papers/2605.31464.md) - uses LLM surrogates to forecast kernel runtime and cut the number of real GPU measurements needed during kernel search.\n\n# Open Questions\n\n* How well do learned or LLM-based kernel evaluators generalize across GPU architectures and kernel families?\n* What is the right budget split between cheap surrogate evaluation and expensive ground-truth GPU measurement during search?\n* Can surrogate-accelerated kernel search be combined with LLM-driven kernel code generation in a single closed loop?", "topics/llm-agents": "# Scope\n\nThis topic tracks papers about LLM agents that execute tasks, build reusable skills, use verification signals, or coordinate with other agents.\n\n# Papers\n\n* [OpenSkill](../papers/2606.06741.md) - open-world self-evolution through skills and self-built verification anchors.\n* [Decentralized Multi-Agent Systems with Shared Context](../papers/2606.10662.md) - multi-agent test-time scaling through shared verified context.\n* [Arbor](../papers/2606.11926.md) - coordinator-executor agents using a persistent hypothesis tree for autonomous research.\n* [EurekAgent](../papers/2606.13662.md) - CLI agents coordinated by an environment that manages permissions, artifacts, budgets, and human oversight.\n\n# Synthesis\n\nOpenSkill focuses on reusable skills and verification anchors, DeLM focuses on shared verified context across agents, Arbor focuses on a persistent hypothesis tree for research state, and EurekAgent focuses on the environment around CLI agents. Together they suggest that durable agent capability depends on external structures as much as prompting: skills, shared memory, hypothesis records, evaluators, budget controls, and artifacts.\n\n# Open Questions\n\n* What should a durable agent skill contain, and what should stay in the knowledge base?\n* How should agents validate generated skills before using them on real tasks?\n* How do skills, shared context, and OKF documents reinforce each other?\n* When should a system improve the agent itself, and when should it improve the environment around the agent?\n* When is a centralized hypothesis tree preferable to decentralized shared memory?", "topics/llm-surrogate-models": "# Scope\n\nThis topic tracks papers that use LLMs as predictive surrogates or evaluators - forecasting the outcome of an expensive process (e.g., compiling and running code, running an experiment) rather than generating the artifact or taking the action themselves.\n\n# Papers\n\n* [GPU Forecasters](../papers/2605.31464.md) - LLM surrogate that forecasts GPU kernel performance and selectively defers to real measurement when uncertain.\n\n# Open Questions\n\n* What makes an LLM surrogate well-calibrated, and how transferable is that calibration across domains?\n* When is it better to use an LLM as a surrogate/evaluator versus as the generator of the artifact being evaluated?\n* How does reinforcement learning on forecast accuracy compare to other ways of improving surrogate calibration (e.g., conformal prediction, ensembling)?", "topics/multi-agent-systems": "# Scope\n\nThis topic tracks papers where multiple agents coordinate reasoning, experimentation, or execution through shared state, task allocation, critique, or self-organization.\n\n# Papers\n\n* [Decentralized Multi-Agent Systems with Shared Context](../papers/2606.10662.md) - decentralized coordination through shared verified context and task queues.\n* [AutoScientists](../papers/2605.28655.md) - self-organizing agent teams for long-running scientific experimentation.\n* [Self-Evolving Multi-Agent Systems via Decentralized Memory](../papers/2605.22721.md) - per-agent dual-pool memory that outperforms centralized memory by up to 23.8% while cutting token usage by 49%.\n\n# Synthesis\n\nTwo complementary decentralization strategies appear in this set: 2606.10662 (DeLM) decentralizes agents while keeping a single shared verified context, whereas 2605.22721 (DecentMem) keeps context centralized per-agent and decentralizes memory. The trade-off is coordination overhead vs. agent diversity — shared context enables tight coherence; per-agent memory preserves behavioral variation and reduces synchronization cost.\n\n# Open Questions\n\n* How should shared state be represented so agents can reuse it without creating integration bottlenecks?\n* When is decentralized coordination better than a central planner?\n* What safeguards are needed when multiple agents update durable knowledge artifacts?\n* How do per-agent memory and shared-context approaches interact when combined in a single system?\n"}, "types": ["Paper", "Topic"], "palette": {"Paper": "#2563eb", "Topic": "#16a34a", "Reference": "#9333ea"}};
</script>
<script>
(function () {
  const bundle = window.BUNDLE;
  const bundleName = window.BUNDLE_NAME;
  document.title = `${bundleName} — OKF Viewer`;
  document.getElementById("bundle-name").textContent = bundleName;

  // Populate type filter
  const typeSelect = document.getElementById("filter-type");
  for (const t of bundle.types) {
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t;
    typeSelect.appendChild(opt);
  }

  // Build reverse-link index for backlinks
  const backlinks = {};
  for (const edge of bundle.edges) {
    const { source, target } = edge.data;
    (backlinks[target] ||= []).push(source);
  }

  // Look up node label/type by id
  const nodeIndex = {};
  for (const n of bundle.nodes) nodeIndex[n.data.id] = n.data;

  const cy = cytoscape({
    container: document.getElementById("graph"),
    elements: [...bundle.nodes, ...bundle.edges],
    style: [
      {
        selector: "node",
        style: {
          "background-color": "data(color)",
          "label": "data(label)",
          "color": "#0f172a",
          "font-size": 11,
          "text-valign": "bottom",
          "text-margin-y": 4,
          "text-wrap": "wrap",
          "text-max-width": 120,
          "width": "data(size)",
          "height": "data(size)",
          "border-width": 1,
          "border-color": "#0f172a",
        },
      },
      {
        selector: "node:selected",
        style: {
          "border-width": 3,
          "border-color": "#f59e0b",
        },
      },
      {
        selector: "edge",
        style: {
          "width": 1.5,
          "line-color": "#cbd5e1",
          "target-arrow-color": "#cbd5e1",
          "target-arrow-shape": "triangle",
          "curve-style": "bezier",
          "arrow-scale": 0.9,
        },
      },
      {
        selector: "edge:selected",
        style: {
          "line-color": "#f59e0b",
          "target-arrow-color": "#f59e0b",
          "width": 2.5,
        },
      },
      {
        selector: ".dim",
        style: { "opacity": 0.15 },
      },
    ],
    layout: { name: "cose", animate: false, padding: 30 },
    wheelSensitivity: 0.2,
  });

  cy.on("tap", "node", (evt) => showDetail(evt.target.id()));
  cy.on("tap", (evt) => {
    if (evt.target === cy) clearSelection();
  });

  document.getElementById("layout").addEventListener("change", (e) => {
    cy.layout({ name: e.target.value, animate: false, padding: 30 }).run();
  });

  document.getElementById("reset").addEventListener("click", () => {
    cy.fit(null, 30);
    clearSelection();
  });

  document.getElementById("search").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      const d = n.data();
      const hay =
        (d.label || "").toLowerCase() + " " +
        d.id.toLowerCase() + " " +
        (d.tags || []).join(" ").toLowerCase();
      n.toggleClass("dim", !hay.includes(q));
    });
    cy.edges().forEach((edge) => {
      const src = edge.source();
      const tgt = edge.target();
      edge.toggleClass("dim", src.hasClass("dim") || tgt.hasClass("dim"));
    });
  });

  document.getElementById("filter-type").addEventListener("change", (e) => {
    const t = e.target.value;
    if (!t) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      n.toggleClass("dim", n.data("type") !== t);
    });
    cy.edges().forEach((edge) => {
      edge.toggleClass("dim", edge.source().hasClass("dim") || edge.target().hasClass("dim"));
    });
  });

  function clearSelection() {
    cy.elements().unselect();
    document.getElementById("detail-empty").hidden = false;
    document.getElementById("detail-content").hidden = true;
  }

  function showDetail(conceptId) {
    const data = nodeIndex[conceptId];
    if (!data) return;
    cy.elements().unselect();
    const node = cy.getElementById(conceptId);
    if (node) node.select();

    document.getElementById("detail-empty").hidden = true;
    const content = document.getElementById("detail-content");
    content.hidden = false;

    const chip = document.getElementById("detail-type");
    chip.textContent = data.type;
    chip.style.background = data.color;

    document.getElementById("detail-title").textContent = data.label;
    document.getElementById("detail-id").textContent = conceptId;
    document.getElementById("detail-description").textContent = data.description || "—";

    const resourceEl = document.getElementById("detail-resource");
    resourceEl.innerHTML = "";
    if (data.resource) {
      const a = document.createElement("a");
      a.href = data.resource;
      a.textContent = data.resource;
      a.target = "_blank";
      a.rel = "noopener";
      a.className = "external";
      resourceEl.appendChild(a);
    } else {
      resourceEl.textContent = "—";
    }

    const tagsEl = document.getElementById("detail-tags");
    tagsEl.innerHTML = "";
    if (data.tags && data.tags.length) {
      for (const t of data.tags) {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = t;
        tagsEl.appendChild(span);
      }
    } else {
      tagsEl.textContent = "—";
    }

    const body = bundle.bodies[conceptId] || "";
    const html = marked.parse(body, { breaks: false, gfm: true });
    const bodyEl = document.getElementById("detail-body");
    bodyEl.innerHTML = html;
    rewriteInternalLinks(bodyEl);

    const bl = backlinks[conceptId] || [];
    const blSection = document.getElementById("detail-backlinks");
    const blList = document.getElementById("backlinks-list");
    blList.innerHTML = "";
    if (bl.length) {
      blSection.hidden = false;
      for (const src of bl) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.textContent = nodeIndex[src]?.label || src;
        a.dataset.target = src;
        a.addEventListener("click", () => showDetail(src));
        li.appendChild(a);
        const muted = document.createElement("span");
        muted.className = "muted";
        muted.textContent = ` (${src})`;
        li.appendChild(muted);
        blList.appendChild(li);
      }
    } else {
      blSection.hidden = true;
    }

    cy.animate({ center: { eles: node }, zoom: Math.max(cy.zoom(), 1.0) }, { duration: 200 });
  }

  function rewriteInternalLinks(root) {
    root.querySelectorAll("a[href]").forEach((a) => {
      const href = a.getAttribute("href");
      if (!href) return;
      if (href.startsWith("/") && href.endsWith(".md")) {
        const target = href.slice(1, -3);
        if (nodeIndex[target]) {
          a.className = "internal";
          a.setAttribute("href", "javascript:void(0)");
          a.addEventListener("click", (e) => {
            e.preventDefault();
            showDetail(target);
          });
          return;
        }
      }
      a.className = "external";
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener");
    });
  }

  // Auto-show the first node (a dataset if available, else first concept)
  const initial =
    bundle.nodes.find((n) => n.data.type === "BigQuery Dataset") ||
    bundle.nodes[0];
  if (initial) showDetail(initial.data.id);
})();

</script>
</body>
</html>
