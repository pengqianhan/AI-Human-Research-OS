<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="AI-Human Research OS app icon">
  <title>AI-Human Research OS</title>
  <!-- ink tile with the OS's dot-grid paper texture -->
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.1" fill="#F2F4F3" fill-opacity="0.16"/>
    </pattern>
    <clipPath id="tile"><rect width="256" height="256" rx="56"/></clipPath>
  </defs>
  <rect width="256" height="256" rx="56" fill="#17262E"/>
  <rect width="256" height="256" fill="url(#dots)" clip-path="url(#tile)"/>
  <!-- the mark, white on ink, centered at 78% -->
  <g transform="translate(28 28) scale(1.5625)">
    <rect x="10" y="14" width="108" height="100" rx="16" fill="none" stroke="#F2F4F3" stroke-width="6"/>
    <line x1="13" y1="40" x2="115" y2="40" stroke="#F2F4F3" stroke-width="3"/>
    <circle cx="26" cy="27" r="4" fill="#C4564A"/>
    <circle cx="38" cy="27" r="4" fill="#B7791F"/>
    <circle cx="50" cy="27" r="4" fill="#2F7D6D"/>
    <g stroke="#F2F4F3" stroke-width="4" stroke-linecap="round" fill="none">
      <line x1="58" y1="62" x2="67.5" y2="62"/>
      <line x1="64" y1="62" x2="64" y2="80"/>
      <line x1="40" y1="80" x2="88" y2="80"/>
      <line x1="40" y1="80" x2="40" y2="88"/>
      <line x1="64" y1="80" x2="64" y2="88"/>
      <line x1="88" y1="80" x2="88" y2="88"/>
    </g>
    <circle cx="50" cy="62" r="8" fill="#F2F4F3"/>
    <circle cx="78" cy="62" r="8" fill="none" stroke="#E8590C" stroke-width="5"/>
    <rect x="34" y="88" width="12" height="12" rx="2.5" fill="#F2F4F3"/>
    <rect x="58" y="88" width="12" height="12" rx="2.5" fill="#F2F4F3"/>
    <rect x="82" y="88" width="12" height="12" rx="2.5" fill="#F2F4F3"/>
  </g>
</svg>
