<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 128" width="560" height="128" role="img" aria-label="AI-Human Research OS">
  <title>AI-Human Research OS</title>
  <desc>The mark beside the wordmark. The wordmark uses IBM Plex Mono; see README.md for the pre-rendered PNGs.</desc>
  <!-- mark -->
  <rect x="10" y="14" width="108" height="100" rx="16" fill="#F2F4F3" stroke="#17262E" stroke-width="6"/>
  <line x1="13" y1="40" x2="115" y2="40" stroke="#17262E" stroke-width="3"/>
  <circle cx="26" cy="27" r="4" fill="#C4564A"/>
  <circle cx="38" cy="27" r="4" fill="#B7791F"/>
  <circle cx="50" cy="27" r="4" fill="#2F7D6D"/>
  <g stroke="#17262E" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="58" y1="62" x2="67.5" y2="62"/>
    <line x1="64" y1="62" x2="64" y2="80"/>
    <line x1="40" y1="80" x2="88" y2="80"/>
