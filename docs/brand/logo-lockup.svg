  <rect x="58" y="88" width="12" height="12" rx="2.5" fill="#17262E"/>
  <rect x="82" y="88" width="12" height="12" rx="2.5" fill="#17262E"/>
  <!-- wordmark -->
  <text x="150" y="58" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="22" font-weight="500" letter-spacing="4" fill="#52646E">AI-HUMAN</text>
  <text x="150" y="98" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="40" font-weight="700" letter-spacing="1" fill="#17262E">RESEARCH <tspan fill="#E8590C">OS</tspan></text>
