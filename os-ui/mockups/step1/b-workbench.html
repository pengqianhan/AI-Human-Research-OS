<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-Human Research OS · Mockup B</title>
<!-- Mockup B, dense workbench. Step 1 structure; project facts come from the workspace files named on screen. -->
<style>
:root{
  --bg:#0e1014;--panel:#15181d;--panel2:#1b1f25;--hover:#21262d;--line:#272c34;--line2:#353b45;
  --text:#d7dbe1;--text2:#aeb5bf;--muted:#8f97a3;--faint:#7f8792;--dis:#5f6673;
  --accent:#e8a33d;--accent-ink:#1b1306;--accent-dim:rgba(232,163,61,.13);--accent-line:rgba(232,163,61,.55);
  --add:#7fdc9c;--add-bg:rgba(46,160,67,.16);--del:#ff9f97;--del-bg:rgba(248,81,73,.15);
  --kw:#cda5f3;--str:#a6d6a2;--num:#7fc1ff;--com:#7f8792;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --serif:"Times New Roman",Times,"Liberation Serif",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
[aria-disabled="true"]{cursor:not-allowed}
h1,h2,h3{margin:0}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)}.t2{color:var(--text2)}.sm{font-size:11.5px}.grow{flex:1}
code.i{font:11.5px var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--text)}
.tag{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border:1px solid var(--line2);border-radius:3px;font:11px var(--mono);color:var(--text2);white-space:nowrap;flex:none}
.tag .ic{width:11px;height:11px}
.tag.sample{border-style:dashed;border-color:#6d7583;color:var(--text);text-transform:uppercase;font:600 9.5px var(--sans);letter-spacing:.07em}
.tag.step{border-style:dotted;color:var(--muted)}
.tag.on{color:var(--text)}.tag.on::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--add)}
.tag.req{color:var(--accent);border-color:var(--accent-line)}
.btn{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border:1px solid var(--line2);border-radius:3px;background:var(--panel2);font-size:12px;color:var(--text);white-space:nowrap;flex:none}
.btn:hover{background:var(--hover)}.btn .ic{width:13px;height:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{height:21px;padding:0 7px;font-size:11.5px}
.btn[aria-disabled="true"]{background:transparent;color:var(--dis);border-color:var(--line)}
.tipr,.tipb{position:relative}
.tipr:hover::after,.tipb:hover::after{content:attr(data-tip);position:absolute;z-index:60;white-space:nowrap;pointer-events:none;background:#2b3038;border:1px solid var(--line2);color:var(--text);padding:3px 7px;border-radius:3px;font:11.5px/1.4 var(--sans);text-transform:none;letter-spacing:0;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.tipr:hover::after{left:calc(100% + 7px);top:50%;transform:translateY(-50%)}
.tipb:hover::after{top:calc(100% + 6px);left:0}
.tipb.r:hover::after{left:auto;right:0}

/* shell */
.app{display:grid;grid-template-columns:56px minmax(0,1fr);grid-template-rows:30px minmax(0,1fr) 22px;height:100vh;width:100vw}
.titlebar{grid-column:1/3;display:flex;align-items:center;gap:9px;padding:0 10px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:12px;color:var(--text2);user-select:none;min-width:0}
.lights{display:flex;gap:6px;margin-right:6px}.lights i{width:11px;height:11px;border-radius:50%;background:#3a3f48;display:block}
.appname{color:var(--text);font-weight:600}
.crumbs{color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{margin-left:auto;display:flex;gap:6px}
.rail{grid-row:2;grid-column:1;position:relative;z-index:5;display:flex;flex-direction:column;padding:6px 0;gap:1px;background:var(--panel);border-right:1px solid var(--line);min-height:0}
.rail-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 6px;color:var(--muted);font-size:10px;line-height:1.1;text-align:center;width:100%}
.rail-btn .ic{width:19px;height:19px}
.rail-btn:hover{color:var(--text);background:var(--hover)}
.rail-btn.on{color:var(--text);background:#1c2027}
.rail-btn.on::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:2px;background:var(--accent)}
.rail-btn[aria-disabled="true"]{color:var(--dis)}.rail-btn[aria-disabled="true"]:hover{background:none;color:var(--dis)}
.rail-btn .step{font-size:8.5px;color:var(--muted);border:1px dotted var(--line2);border-radius:2px;padding:0 2px;margin-top:1px}
.rail .sep{height:1px;background:var(--line);margin:6px 10px}
.rail .qlabel{font-size:8.5px;color:var(--muted);text-align:center;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.qa{display:flex;align-items:center;justify-content:center;width:34px;height:28px;margin:0 auto;border:1px solid var(--line2);border-radius:4px;font:600 11px var(--mono);color:var(--text);background:var(--panel2)}
.qa:hover{border-color:var(--muted)}.qa.on{border-color:var(--accent-line);color:var(--accent)}
.rail .push{flex:1}
main{grid-row:2;grid-column:2;min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.statusbar{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 10px;background:var(--panel2);border-top:1px solid var(--line);font-size:11.5px;color:var(--text2);white-space:nowrap;overflow:hidden}
.statusbar .sb{display:inline-flex;align-items:center;gap:5px}.statusbar .ic{width:12px;height:12px}
.statusbar .r{margin-left:auto;display:flex;gap:16px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#8f97a3;flex:none}
.shead{height:38px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel);min-width:0;white-space:nowrap}
.shead h1{font-size:13px;font-weight:600}
.shead .muted{overflow:hidden;text-overflow:ellipsis}
.crumb-btn{color:var(--text2)}.crumb-btn:hover{color:var(--text);text-decoration:underline}

/* conversation */
.conv{display:flex;flex-direction:column;min-height:0;min-width:0}
.conv-head{height:32px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden}
.conv-head .muted{overflow:hidden;text-overflow:ellipsis}
.sband{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;margin:0 -12px 4px;padding:5px 12px;background:var(--panel);border-bottom:1px dashed var(--line2);white-space:nowrap;overflow:hidden}
.sband .tag{flex:none}.sband span:last-child{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.conv-head .ttl{font-weight:600}
.agent{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border:1px solid var(--line2);border-radius:10px;font-size:11.5px;color:var(--text)}
.conv-log{flex:1;min-height:0;overflow:auto;padding:0 12px 8px}
.msg{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:5px 0;max-width:780px}
.av{width:22px;height:22px;border-radius:3px;display:flex;align-items:center;justify-content:center;font:600 10px var(--mono);background:var(--panel2);border:1px solid var(--line2);color:var(--text2)}
.av.ag{color:var(--accent);border-color:var(--accent-line)}
.who{font-size:11.5px;color:var(--muted);line-height:22px}.who b{color:var(--text);font-weight:600}
.body{color:var(--text)}
.refs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.runcard{margin:6px 0 0;padding:6px 9px;border:1px solid var(--line2);border-radius:3px;background:var(--bg);font:11.5px/1.55 var(--mono);color:var(--text2);white-space:pre-wrap}
.note{margin:6px 0 4px 30px;padding:4px 8px;border:1px dashed var(--line2);border-radius:3px;font-size:11.5px;color:var(--muted)}
.composer{flex:none;display:flex;flex-direction:column;gap:6px;padding:7px 10px 8px;border-top:1px solid var(--line);background:var(--panel)}
.composer textarea{width:100%;height:34px;resize:none;background:var(--bg);border:1px solid var(--line2);border-radius:3px;color:var(--text);font:13px/1.4 var(--sans);padding:7px 8px;outline:none}
.composer textarea::placeholder{color:var(--muted)}
.composer textarea:focus{border-color:var(--accent-line)}
.cbar{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);min-width:0}
.cbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cbar .btn{margin-left:auto}
.chips{display:flex;flex-wrap:wrap;gap:4px}.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:4px;max-width:100%;height:20px;padding:0 3px 0 5px;border:1px solid var(--accent-line);background:var(--accent-dim);border-radius:3px;font:11.5px var(--mono);color:var(--text);white-space:nowrap;overflow:hidden}
.chip .ic{width:12px;height:12px;color:var(--accent)}
.chip button{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:2px;color:var(--text2)}
.chip button:hover{background:rgba(255,255,255,.08)}
.chip.ro{border-color:var(--line2);background:var(--panel2)}.chip.ro .ic{color:var(--muted)}
.flash{animation:flash 1s ease-out}
@keyframes flash{0%{box-shadow:inset 0 0 0 2px var(--accent)}100%{box-shadow:inset 0 0 0 2px transparent}}

/* home */
.home{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:12px 14px}
.rootbox{height:340px;flex:none;display:flex;flex-direction:column;border:1px solid var(--line);background:var(--panel)}
.rootbox>.conv{flex:1}
.sec-h{display:flex;align-items:center;gap:10px;flex:none;white-space:nowrap}
.sec-h h2{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text2)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;flex:none}
.card{display:flex;flex-direction:column;gap:6px;min-width:0;padding:9px 11px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.card:hover{border-color:#4a515c;background:#171b21}
.card.sample{border-style:dashed}
.card .top{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap}
.card .name{font:600 13px var(--mono);overflow:hidden;text-overflow:ellipsis}
.pi{display:inline-flex;align-items:center;justify-content:center;width:22px;height:18px;border:1px solid var(--line2);border-radius:3px;font:600 10px var(--mono);color:var(--text2);flex:none}
.card .goal{color:var(--text2);font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kv{display:grid;grid-template-columns:76px minmax(0,1fr);gap:3px 8px;margin:0;font-size:12px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kv dd.one{-webkit-line-clamp:1;word-break:break-all}
.card .src{font:10.5px var(--mono);color:var(--muted);margin-top:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* tables */
.tblwrap{flex:1;min-height:0;overflow:auto}
.tbl{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12.5px}
.tbl th{position:sticky;top:0;z-index:1;background:var(--panel2);text-align:left;font-weight:500;font-size:11.5px;color:var(--muted);padding:5px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:5px 10px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--hover)}
.tbl tr.on td{background:#1f242b}.tbl tr.on td:first-child{box-shadow:inset 2px 0 var(--accent)}
.tbl tr.off td{color:var(--muted)}
.tbl.wrap td{white-space:normal}
.toolrow{height:38px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line)}
.input{height:24px;width:240px;background:var(--bg);border:1px solid var(--line2);border-radius:3px;color:var(--text);font:12px var(--sans);padding:0 8px;outline:none}
.input:focus{border-color:var(--accent-line)}.input::placeholder{color:var(--muted)}
.foot-note{flex:none;padding:8px 14px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line)}

/* workspace */
.ws-body{flex:1;min-height:0;display:grid;grid-template-columns:var(--convw,340px) 6px minmax(0,1fr)}
.conv-proj{background:var(--panel)}
.pinned{flex:none;padding:6px 10px;border-bottom:1px solid var(--line);font-size:12px;background:#171a20}
.pinned .lbl{font:10.5px var(--mono);color:var(--muted);display:block}
.pinned .txt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.splitter{cursor:col-resize;background:linear-gradient(var(--line),var(--line)) center/1px 100% no-repeat;position:relative}
.splitter::after{content:"";position:absolute;left:1px;top:50%;width:4px;height:26px;margin-top:-13px;border-left:1px solid var(--line2);border-right:1px solid var(--line2)}
.splitter:hover,.splitter.drag{background:linear-gradient(var(--accent-line),var(--accent-line)) center/2px 100% no-repeat}
body.dragging{cursor:col-resize;user-select:none}
.views{display:flex;flex-direction:column;min-width:0;min-height:0}
.vtabs{height:34px;flex:none;display:flex;align-items:stretch;background:var(--panel);border-bottom:1px solid var(--line)}
.vtab{display:flex;align-items:center;gap:6px;padding:0 14px;border-right:1px solid var(--line);font-size:12.5px;color:var(--text2);white-space:nowrap}
.vtab:hover{color:var(--text);background:var(--hover)}
.vtab.on{color:var(--text);background:var(--bg);box-shadow:inset 0 2px var(--accent);margin-bottom:-1px}
.vtab[aria-disabled="true"]{color:var(--dis)}.vtab[aria-disabled="true"]:hover{background:none;color:var(--dis)}
.vtab .step{font:9.5px var(--mono);color:var(--muted);border:1px dotted var(--line2);border-radius:2px;padding:0 3px}
.vtabs .right{margin-left:auto;display:flex;align-items:center;gap:8px;padding-right:10px}
.view{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.subbar{height:31px;flex:none;display:flex;align-items:center;gap:10px;padding:0 8px;border-bottom:1px solid var(--line);background:var(--panel);white-space:nowrap;min-width:0}
.subbar .muted{overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:3px;overflow:hidden;flex:none}
.seg button{height:22px;padding:0 10px;font-size:12px;color:var(--text2);display:inline-flex;align-items:center;gap:5px}
.seg button+button{border-left:1px solid var(--line2)}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--hover);color:var(--text);box-shadow:inset 0 -2px var(--accent)}
.cnt{font:10.5px var(--mono);color:var(--muted)}

/* code view */
.codegrid{flex:1;min-height:0;display:grid;grid-template-columns:236px minmax(0,1fr)}
.tree,.clist{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--panel)}
.tree-head{height:26px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--line);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tree-head .mono{font-size:10.5px;text-transform:none;letter-spacing:0}
.tree-list{flex:1;min-height:0;overflow:auto;padding:3px 0 10px}
.trow{display:flex;align-items:center;gap:4px;height:21px;padding-right:8px;font-size:12.5px;color:var(--text2);white-space:nowrap;cursor:pointer}
.trow:hover{background:var(--hover);color:var(--text)}
.trow .ic{width:14px;height:14px;color:var(--muted)}
.trow .chev{width:12px;height:12px;transition:transform .1s}.trow .chev.open{transform:rotate(90deg)}
.trow .nm{overflow:hidden;text-overflow:ellipsis}
.trow.f .nm{font-family:var(--mono);font-size:12px}
.trow.act{background:#1f242b;color:var(--text)}
.trow.is-sel{background:var(--accent-dim);color:var(--text);box-shadow:inset 2px 0 var(--accent)}
.xd{width:5px;height:5px;border-radius:50%;background:var(--muted);margin-left:auto;flex:none}
.editor{display:flex;flex-direction:column;min-width:0;min-height:0}
.etabs{height:30px;flex:none;display:flex;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden}
.etab{display:flex;align-items:center;gap:6px;flex:none;padding:0 6px 0 10px;border-right:1px solid var(--line);font:12px var(--mono);color:var(--text2);white-space:nowrap;cursor:pointer}
.etab .ic{width:13px;height:13px;color:var(--muted)}
.etab.on{background:var(--bg);color:var(--text);box-shadow:inset 0 1px var(--accent)}
.etab .x{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:3px;color:var(--muted)}
.etab .x .ic{width:11px;height:11px}.etab .x:hover{background:var(--hover);color:var(--text)}
.epath{height:27px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);font:11.5px var(--mono);color:var(--muted);white-space:nowrap;min-width:0}
.epath .p{overflow:hidden;text-overflow:ellipsis}
.epath .btn{margin-left:auto;font-family:var(--sans)}
.code{flex:1;min-height:0;overflow:auto;padding:4px 0 28px;font:12px/19px var(--mono)}
.in{display:inline-block;min-width:100%}
.cl{display:flex;white-space:pre;cursor:pointer}
.cl:hover,.cl:hover .gn{background:#151920}
.gn{position:sticky;left:0;flex:none;width:50px;padding-right:14px;text-align:right;color:var(--faint);background:var(--bg);user-select:none}
.gc{padding-right:28px}
.cl.is-sel,.cl.is-sel .gn{background:#28221a}.cl.is-sel .gn{color:var(--accent)}
.k{color:var(--kw)}.s{color:var(--str)}.n{color:var(--num)}.c{color:var(--com);font-style:italic}.h{color:#eef0f3;font-weight:700}
.efoot{height:22px;flex:none;display:flex;align-items:center;gap:14px;padding:0 10px;border-top:1px solid var(--line);background:var(--panel);font:11px var(--mono);color:var(--muted);white-space:nowrap}
.empty{padding:28px 24px;color:var(--muted);max-width:560px}.empty p{margin:8px 0 0}
/* changes */
.chgrid{flex:1;min-height:0;display:grid;grid-template-columns:300px minmax(0,1fr)}
.clist-s{flex:1;min-height:0;overflow:auto}
.citem{padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.citem:hover{background:var(--hover)}
.citem.on{background:#1f242b;box-shadow:inset 2px 0 var(--accent)}
.r1{display:flex;align-items:center;gap:7px}.r1 .ic{width:14px;height:14px;color:var(--muted)}
.hash{font:600 12px var(--mono);color:var(--num)}
.date{font:11px var(--mono);color:var(--muted);margin-left:auto}
.subj{margin-top:3px;font-size:12.5px;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st{margin-top:3px;font:11px var(--mono);color:var(--muted)}
.plus{color:var(--add)}.minus{color:var(--del)}
.cnote{padding:10px;font-size:10.5px;color:var(--muted)}
.dpane{display:flex;flex-direction:column;min-width:0;min-height:0}
.dhead{flex:none;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.dhead .r1 .date{margin-left:0}
.dsubj{margin-top:2px;font-weight:600}
.dscroll{flex:1;min-height:0;overflow:auto;padding-bottom:20px}
.fstat{margin:10px 12px 0;border:1px solid var(--line)}
.fstat .row{display:flex;align-items:center;gap:10px;height:22px;padding:0 10px;font:12px var(--mono);border-bottom:1px solid var(--line);cursor:pointer}
.fstat .row:last-child{border-bottom:0}.fstat .row:hover{background:var(--hover)}
.fstat .row.is-sel{background:var(--accent-dim)}
.fstat .p{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.fstat .nums{width:110px;text-align:right;flex:none}

    Code/results/summary.json           per-stage exit code, wall time, peak RAM; headline metrics; probe deltas
    Figs/baseline_training_curves.svg   base train loss, base val bpb, SFT val bpb
    Figs/probe_comparison.svg           val bpb of the baseline and both probes at matched steps
"""

import json
import math

LOGS = CODE / "results" / "logs"

}

INK, INK2, MUTED, GRID, SURFACE = "#0b0b0b", "#52514e", "#898781", "#e6e5e0", "#fcfcfb"

TRAIN_RE = re.compile(r"^step (\d+)\S* .*?\| loss: ([\d.]+) .*?\| dt: ([\d.]+)ms \| tok/sec: ([\d,]+)")
VAL_RE = re.compile(r"^Step (\d+) \| Validation bpb: ([\d.]+)")
SUMMARY_RE = re.compile(r"^\[run_logged\] exit=(-?\d+) wall_s=([\d.]+) peak_rss_mb=(\d+)")

def read(name):
    path = LOGS / f"{name}.log"
    return path.read_text(encoding="utf-8").splitlines() if path.exists() else None

def parse_run(lines):
    rows = {}
    for line in lines:

<script type="text/plain" id="src-readme">
# Code: nanochat CPU example

The OpenResearch default demo, Andrej Karpathy's nanochat, shrunk until every
stage runs on a laptop-class CPU in a few minutes. It is a first example that
any Research OS user can run once, **not a research result**. The model has
0.84M parameters and cannot answer questions; its chat reply is expected to be
nonsense. Success means every stage completes and validation bits per byte
(bpb) falls during pretraining.

## What to expect

Measured on 2026-09-26 on Windows 11 with an Intel i7-12700 (12 cores, 20
threads), 32 GB RAM, CPU only. The run started with an empty data cache but an
existing `uv` package cache.

| | Whole example (`all`) | Baseline stages only |
|---|---|---|
| Wall-clock time | **2 min 57 s** | 1 min 29 s (+ `uv sync`) |
| Peak RAM per process | 1.0 GB (data download); training ≤ 0.94 GB | same |
| Data downloads | ~0.20 GB: 2 pretraining shards (~184 MB) + ~14 MB of SFT data | same |
| Python packages (first setup only) | ~0.2 GB of wheels, mostly the 106 MB CPU `torch` wheel | same |
| Disk inside the project | ~0.9 GB: `.venv` 0.68 GB, `.cache` ~0.21 GB | same |

Slower machines should scale roughly with single-socket CPU speed; nothing
needs a GPU.

## Setup

Prerequisites: [`uv`](https://docs.astral.sh/uv/) and `bash`. On Windows, use
Git Bash's `bash`. Nothing is installed system-wide. `uv` creates
`Code/nanochat/.venv`, and all data, checkpoints, and logs stay under
`Code/nanochat/.cache/` and `Code/results/`.

## Run it (one command)

```bash
cd Code/nanochat
bash runs/runcpu_small.sh all
```

`all` runs these stages in order. Each stage is also a separate command,
e.g. `bash runs/runcpu_small.sh base eval`:

| Stage | What it runs ([runs/runcpu_small.sh](nanochat/runs/runcpu_small.sh)) | Measured |
|---|---|---|
| `setup` | `uv sync --extra cpu --frozen` | < 1 s with a warm uv cache |
| `data` | `python -m nanochat.dataset -n 1`: 1 train shard + the pinned val shard | 13.2 s |
| `tok` | `tok_train --max-chars=50000000 --vocab-size=4096`, then `tok_eval` | 3.2 s + 3.5 s |
| `base` | `base_train --depth=1 --aspect-ratio=64 --head-dim=64 --window-pattern=L --max-seq-len=256 --device-batch-size=16 --total-batch-size=4096 --eval-every=25 --eval-tokens=65536 --core-metric-every=-1 --sample-every=100 --num-iterations=300` | 42.3 s |
| `eval` | `base_eval --eval=bpb,sample --device-batch-size=1 --split-tokens=16384` | 3.7 s |
| `sft` | `chat_sft --load-optimizer=0 --eval-every=10 --eval-tokens=32768 --chatcore-every=-1 --num-iterations=40 --init-lr-frac=0.1 --data-keep-every=128` (downloads its data) | 20.5 s |
| `chat` | `chat_cli -p "What is the capital of France?"` | 2.7 s |
| `probe_lr` | `base` recipe with `--matrix-lr=0.04 --model-tag=probe_lr2x` | 47.1 s |
| `probe_vocab` | 2,048-token tokenizer in `.cache/nanochat_v2048`, then the `base` recipe with `--model-tag=probe_vocab2048` | 3.3 s + 35.1 s |
| `summary` | [tools/summarize_results.py](tools/summarize_results.py) writes tables and figures | < 1 s |

Every stage runs through [tools/run_logged.py](tools/run_logged.py). It tees
output to `Code/results/logs/<stage>.log` and appends exit code, wall time, and
peak resident memory. The runner sets `NANOCHAT_BASE_DIR`,
`NANOCHAT_COMPILE=0`, and `ARROW_DEFAULT_MEMORY_POOL=system`. To run a script by

#!/bin/bash

# Tiny CPU version of runs/runcpu.sh (the OpenResearch nanochat demo), meant as a first example that
# any Research OS user can run once in a few minutes. Same stages as the demo (tokenizer, base
# pretraining, base eval, SFT, one chat reply) plus the demo's two probes, at the smallest scale that
# still runs every stage. The model is far too small to answer correctly; the point is the pipeline.
# See ../README.md for expected runtime, memory, downloads, the recipe, and the changes from the demo.

# Run from Code/nanochat:
#   bash runs/runcpu_small.sh all          # everything below, in order
#   bash runs/runcpu_small.sh STAGE...     # setup data tok base eval sft chat probe_lr probe_vocab summary

set -euo pipefail

export NANOCHAT_BASE_DIR="$PWD/.cache/nanochat"
export NANOCHAT_COMPILE=0                 # no torch.compile: Inductor on Windows CPU needs MSVC cl.exe on PATH
export ARROW_DEFAULT_MEMORY_POOL=system   # mimalloc keeps freed Arrow memory, inflating peak RAM
export PYTHONUNBUFFERED=1 PYTHONIOENCODING=utf-8
LOG_DIR="../results/logs"
PY=".venv/Scripts/python"; [ -x "$PY" ] || PY=".venv/bin/python"
# run NAME CMD...: tee output to $LOG_DIR/NAME.log and append wall time and peak RSS
run() { local name=$1; shift; mkdir -p "$LOG_DIR"; "$PY" ../tools/run_logged.py "$LOG_DIR/$name.log" -- "$@"; }

# Base pretraining recipe shared by the baseline and both probes (same schedule, compared at every eval)
BASE_ARGS=(
    --depth=1 --aspect-ratio=64 --head-dim=64 --window-pattern=L
    --max-seq-len=256 --device-batch-size=16 --total-batch-size=4096
    --eval-every=25 --eval-tokens=65536
    --core-metric-every=-1 --sample-every=100
    --num-iterations=300

  '<div class="pt-author"></div><div class="pt-date">September 2026</div>' +
  '<div class="pt-absh">Abstract</div>' +
  '<p class="pt-abs" data-ref="' + R + '1 · Abstract">We shrink OpenResearch’s default nanochat demo until every stage, from tokenizer training through pretraining, evaluation, supervised fine-tuning (SFT), and chat, runs on a laptop-class CPU. With a one-layer, 0.84M-parameter model, a 4,096-token vocabulary, and 300 pretraining steps, the full pipeline, including two probe runs, finishes in 2&nbsp;min&nbsp;57&nbsp;s on an Intel i7-12700, using at most 1.0&nbsp;GB of RAM per process. Validation bits per byte (bpb) falls from 3.456 to 2.288 during pretraining and from 2.289 to 2.146 during SFT. Doubling the Muon matrix learning rate lowers the final bpb by 0.012, and halving the vocabulary raises it by 0.096. The model produces no useful answers: the contribution is a runnable, deterministic first example for the Research OS, not a research result.</p>' +
  '<h3 class="pt-h"><span>1</span>Introduction</h3>' +
  '<p class="first" data-ref="' + R + '1 · §1 Introduction ¶1">The AI-Human Research OS organizes research as plain files that a human and code agents share. Its users need one example project they can run end to end on their own machine, to see the idea, code, figures, results, and paper live together. OpenResearch <span class="cite">[2]</span> ships such a demo: it trains nanochat <span class="cite">[6]</span>, a compact pipeline for building a chat model, at depth&nbsp;6 with 73.5M parameters for 5,000 pretraining and 1,500 SFT steps on an Apple M3 Max. Its pretraining alone would take over nine hours on the CPU used here.</p>' +
  '<p data-ref="' + R + '1 · §1 Introduction ¶2">This project ports that demo and scales it down until the whole pipeline takes about three minutes on a CPU. It contributes (i)&nbsp;a one-command, staged, CPU-only port whose code changes are documented; (ii)&nbsp;measurements of the time, memory, and learning curves of every stage; and (iii)&nbsp;the demo’s two probes, a larger matrix learning rate and a smaller vocabulary, run at this scale.</p>' +
  '<h3 class="pt-h"><span>2</span>Setup</h3>' +
  '<p class="first" data-ref="' + R + '1 · §2 Setup · Code"><b>Code.</b> The port starts from OpenResearch commit <span class="tt">27cb342</span>, path <span class="tt">demo/nanochat</span>, with the demo’s overrides applied. The code changes are small: <span class="tt">torch.compile</span> becomes switchable and is off on CPU, because the Windows CPU backend needs a C++ compiler; SFT data can be downloaded as an evenly spaced subsample; and CORE prompts are cropped to the rotary cache length. A staged runner executes each stage in under a minute and logs its exit code, wall time, and peak memory.</p>' +
  '<div class="pnum">1</div>';
var T1 = [['Model', 'depth 6, width 384, 73.5M params', 'depth 1, width 64, 0.84M params'], ['Tokenizer', '32,768 vocab, 2B chars', '4,096 vocab, 50M chars'], ['Context / batch', '512 / 16,384 tokens', '256 / 4,096 tokens'], ['Pretraining data', '8 shards (∼0.8 GB)', '1 train + 1 val shard (∼184 MB)'], ['Pretraining steps', '5,000 (81.9M tokens)', '300 (1.23M tokens)'], ['SFT data', 'full splits (∼980 MB)', '∼1/128 of each split (∼14 MB)'], ['SFT steps / LR fraction', '1,500 / 0.8', '40 / 0.1'], ['Base evaluation', 'CORE + bpb + samples', 'bpb + samples']];
var PAGE2 =
  '<div data-ref="' + R + '2 · Table 1"><table class="ptbl"><thead><tr><th>Knob</th><th>Demo</th><th>This example</th></tr></thead><tbody>' +
  T1.map(function (r) { return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td><td>' + r[2] + '</td></tr>'; }).join('') +
  '</tbody></table><div class="pcap">Table 1: Recipe of the OpenResearch demo and of this example.</div></div>' +
  '<p class="first" data-ref="' + R + '2 · §2 Setup · Recipe"><b>Recipe.</b> Table 1 compares the demo’s recipe with this example. The data-to-parameter ratio of pretraining stays close to the demo’s (3.95 versus 3.5 tokens per scaling parameter). Pretraining uses one training shard and the pinned validation shard of <span class="tt">climbmix-400b-shuffle</span> <span class="cite">[7]</span>. SFT uses the demo’s mixture of SmolTalk <span class="cite">[1]</span>, MMLU <span class="cite">[4]</span>, and GSM8K <span class="cite">[3]</span>, subsampled to about 1/128 of every split. Matrix parameters are trained with Muon <span class="cite">[5]</span>, as in nanochat. SFT starts at 0.1 of the inherited learning rate: at the demo’s 0.8, SFT validation bpb spiked from 2.29 to 2.63 and ended above its start.</p><div class="gap"></div>' +
  '<p class="first" data-ref="' + R + '2 · §2 Setup · Hardware and metric"><b>Hardware and metric.</b> All runs use Windows&nbsp;11 on an Intel i7-12700 (12 cores, 20 threads) with 32&nbsp;GB of RAM and no GPU, in eager mode. The metric is validation bits per byte (bpb), measured every 25 pretraining steps on 65,536 validation tokens and every 10 SFT steps on 32,768 tokens. Training is deterministic on this machine: two fresh runs gave identical validation bpb to six decimals.</p>' +
  '<h3 class="pt-h"><span>3</span>Results</h3>' +
  '<p class="first" data-ref="' + R + '2 · §3 Results · Learning curves"><b>Learning curves.</b> Pretraining lowers validation bpb from 3.4564 to 2.2882 in 300 steps (Figure&nbsp;1). The base evaluation on 16,384 tokens per split gives 2.2947 bpb on training data and 2.3622 on validation data. SFT then lowers validation bpb from 2.2892 to 2.1456 in 40 steps. Asked “What is the capital of France?”, the SFT model replies with nonsense (<span class="tt">ATedning the date that is - min B</span>, whitespace collapsed), as expected at 0.84M parameters; the demo’s 73.5M model answered “Paris”.</p><div class="gap"></div>' +
  '<p class="first" data-ref="' + R + '2 · §3 Results · Probes"><b>Probes.</b> Both probes repeat the 300-step schedule with one change (Table&nbsp;2). Doubling the Muon matrix learning rate is neutral through step 100 and then slightly better, ending 0.012 bpb lower. The 2,048-token vocabulary is worse at every step; the gap narrows from 0.23 to 0.10 bpb but does not close. The demo’s own probe results are not part of the copied evidence, so whether these directions match the demo’s is not checked.</p><div class="gap"></div>' +
  '<p class="first" data-ref="' + R + '2 · §3 Results · Cost"><b>Cost.</b> On a first run with an empty data cache, the whole pipeline takes 2&nbsp;min&nbsp;57&nbsp;s, of which the baseline stages take 1&nbsp;min&nbsp;29&nbsp;s. Pretraining takes 42.3&nbsp;s, SFT 20.5&nbsp;s, and the two probes 47.1&nbsp;s and 38.4&nbsp;s. The largest process peaks at 1.0&nbsp;GB of RAM (the data download); training stays at or below 0.94&nbsp;GB. The run downloads about 0.20&nbsp;GB of data and uses about 0.9&nbsp;GB of disk inside the project, mostly for the Python environment.</p>' +

/* ---- syntax colouring (display only) ---- */
var KW = {
  py: 'import from def return for in if elif else lambda with as not and or is None True False class while try except raise yield pass continue break global'.split(' '),
  sh: 'export local set if then else fi for do done case esac function return shift in'.split(' '),
  json: ['true', 'false', 'null']
};
function mdLine(l) {
  if (/^#{1,6} /.test(l)) return sp('h', l);
  return esc(l).replace(/`([^`]+)`/g, '<span class="s">`$1`</span>').replace(/\*\*([^*]+)\*\*/g, '<b>**$1**</b>').replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<span class="n">[$1]($2)</span>');
}
function highlight(lines, lang) {
  if (lang === 'md') return lines.map(mdLine);
  var kws = {}; (KW[lang] || []).forEach(function (k) { kws[k] = 1; });
  var re = /(#.*$)|("""|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|\b([A-Za-z_]\w*)\b|(\b\d[\d_.]*\b)/g;
  var inDoc = false;
  return lines.map(function (line) {
    var h = '', i = 0, m, e;
    if (inDoc) {
      e = line.indexOf('"""');
      if (e < 0) return sp('s', line);
      h = sp('s', line.slice(0, e + 3)); i = e + 3; inDoc = false;
    }
    re.lastIndex = i;
    while ((m = re.exec(line))) {
      h += esc(line.slice(i, m.index));
      if (m[1] !== undefined) h += lang === 'json' ? esc(m[1]) : sp('c', m[1]);
      else if (m[2] !== undefined) {
        if (m[2] === '"""' && lang === 'py') {
          e = line.indexOf('"""', m.index + 3);
          if (e < 0) { h += sp('s', line.slice(m.index)); inDoc = true; i = line.length; break; }
          h += sp('s', line.slice(m.index, e + 3)); i = e + 3; re.lastIndex = i; continue;
        }
        h += sp('s', m[2]);
      } else if (m[3] !== undefined) h += kws[m[3]] ? sp('k', m[3]) : esc(m[3]);
      else h += sp('n', m[4]);
      i = re.lastIndex;
    }
    if (i < line.length) h += esc(line.slice(i));
    return h;
  });
}

function diffHTML(c) {
  var h = '', o = 0, n = 0, file = '', open = false, inHunk = false;

}
